name: ci

# saas-identity-platform-aspnetcore (ASP.NET Core 8 backend)
# 推送链:
# - branch push(master/main) → 只跑 test（对齐门禁 L1-L4）
# - tag push(v<X>.<Y>.<Z>-<YYYYMMDD> per tag.md §1) → test + docker build & push + VPS 部署
# 镜像名/SSH 路径/部署脚本用 ${{ github.event.repository.name }} 避免跨仓劫持。
# 路径与姊妹仓 saas-identity-platform-{react,vue,nextjs,springboot} 同款 (镜像 react ci.yml)。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: L1 format
        run: dotnet format src/Saas.Identity.AspNetCore.csproj --verify-no-changes --include src/**
      - name: L2+L3 build (warnings as errors)
        run: dotnet build tests/Saas.Identity.AspNetCore.Tests.csproj -p:TreatWarningsAsErrors=true
      - name: L4 test
        run: dotnet test tests/Saas.Identity.AspNetCore.Tests.csproj

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env,with.envs 列出要转发的名字 (逗号分隔)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,DATABASE_USER,DATABASE_PASSWORD,NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 每次都重拉 deploy 脚本
            # （避免 v0.x.y 修了 deploy 脚本但 VPS 还跑着旧版的坑：
            #   原先 \`if [ ! -f ]\` 只在文件不存在时下载, 之后再也不更新 → CI deploy
            #   永远用旧逻辑。改成无条件 curl 重拉, 脚本若未变也不会触发其它副作用）
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            # aspnetcore 额外拉 nginx-vps.conf.example（deploy 脚本自举 nginx vhost 用）
            if [ ! -f "nginx-vps.conf.example" ] && [ ! -d deploy ]; then
              curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/nginx-vps.conf.example" -o "nginx-vps.conf.example" || true
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"