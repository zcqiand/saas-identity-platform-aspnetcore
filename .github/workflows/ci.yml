name: ci

# 门禁镜像：与 .harness/stack.json 的 L1-L4 一致（test-only）。
# 本仓无 Docker 镜像 / VPS 部署 -- 旧版 ci.yml 是从
# lab-management-system-nextjs 错抄的 deploy 链，已删。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: L1 format
        run: dotnet format src/Saas.Identity.AspNetCore.csproj --verify-no-changes --include src/**
      - name: L2+L3 build (warnings as errors)
        run: dotnet build tests/Saas.Identity.AspNetCore.Tests.csproj /p:TreatWarningsAsErrors=true
      - name: L4 test
        run: dotnet test tests/Saas.Identity.AspNetCore.Tests.csproj
