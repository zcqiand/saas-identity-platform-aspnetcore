name: ci

# 推送链照抄姊妹仓 saas-identity-platform(已验证能跑),见其 docs/DEPLOYMENT.md。
# - branch push(master/main)→ 只跑 test(对齐门禁 L1-L4)
# - tag push(v1.1-001 这种)  → test + docker build & push + VPS 部署
on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24:npm 10.8(node 20)对本仓 lock 里 tsx 嵌套 esbuild optional 结构误判
          # "Missing from lock file";npm 11(node 24)与本地一致,ci 可过。Dockerfile 同步 24。
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmmirror.com/
      - name: Install dependencies
        run: npm ci
      # 先 build:生成 next-env.d.ts 与 .next/types(typedRoutes),否则干净环境 tsc 缺类型;
      # 同时在 docker 步骤之前就把生产 build 炸点暴露出来。
      # DB_PATH=:memory: —— next build 会 import src/db/index.ts(顶层开库),CI 没有 data/ 目录
      - name: Build
        run: npm run build
        env:
          DB_PATH: ":memory:"
      # 对齐 .harness/stack.json 的 L1-L4 门禁链(本项目无 coverage 配置)
      - name: L1 format
        run: npx --no prettier --check src tests
      - name: L2 lint
        run: npx --no eslint src tests
      - name: L3 typecheck
        run: npx --no tsc --noEmit
      - name: L4 test
        run: npx --no vitest run

  # tag 即放行:push v<MAJOR>.<MINOR>-<NNN> → test 绿 →
  #   docker build & push(latest + 版本 tag)→ VPS pull & restart
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # secrets 全部建在 Repository 级,不声明 environment(saas 坑 7/8)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lab-management-system-nextjs:latest
            ${{ secrets.DOCKER_USERNAME }}/lab-management-system-nextjs:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # 不传 fingerprint,走 TOFU(saas 坑 5/6 的结论)
          # lab.env 自举内联在此:VPS 上那份部署脚本是副本,repo 里的更新不会自动同步;
          # 密钥在 VPS 运行时生成,不出现在 CI 日志
          script: |
            cd /home/deploy/lab-management-system-nextjs
            if [ ! -f lab.env ]; then umask 077; printf 'AUTH_JWT_SECRET=%s\n' "$(openssl rand -hex 32)" > lab.env; fi
            sh lab-management-system-nextjs.sh "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
